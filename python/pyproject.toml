[project]
name = "apiverve-stockmarketopentimes"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Stock Market Open Times checks if a global stock exchange is currently trading and provides its opening and closing times. Pass an exchange code like NYSE or LSE to get current open status, official exchange name, and session hours."
keywords = ["stock market open times api", "stock exchange trading hours", "check if market is open", "global exchange opening times", "is nyse open right now"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/stockmarketopentimes?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/stockmarketopentimes?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/stockmarketopentimes-api"
Twitter = "https://twitter.com/apivervehq"
