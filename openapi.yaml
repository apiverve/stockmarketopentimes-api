openapi: 3.0.4
info:
  title: Stock Market Open Times
  description: >-
    Stock Market Open Times checks if a global stock exchange is currently
    trading and provides its opening and closing times. Pass an exchange code
    like NYSE or LSE to get current open status (open, closed, weekend or
    holiday), the holiday name, official exchange name, and session hours. On
    paid plans, add schedule=true for the exchange's local time, half-day early
    closes, and the next open and close with a countdown in minutes.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/stockmarketopentimes:
    get:
      summary: Stock Market Open Times
      description: >-
        Get the open times and trading status of the stock market on the current
        date of the request, optionally with the next open and close
      operationId: stockmarketopentimes
      parameters:
        - name: exchange
          in: query
          schema:
            type: string
          required: true
          description: The stock exchange code
          example: NYSE
        - name: schedule
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include local time, half-day early close, next open and close, and
            minutes until the next change
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  timezone: America/New_York
                  exchange: NYSE
                  fullName: New York Stock Exchange
                  isOpen: false
                  openingTime: '2026-11-06 09:30:00'
                  closingTime: '2026-11-06 16:00:00'
                  status: closed
                  holidayName: null
                  localTime: '2026-11-06 01:26:52'
                  isHalfDay: false
                  earlyCloseTime: null
                  nextChange: open
                  nextOpen: '2026-11-06T09:30:00-05:00'
                  nextClose: '2026-11-06T16:00:00-05:00'
                  minutesUntilChange: 484
                  calendarVerified: true
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
